version: runtime_target_contract_v1
target_id: so101_isaac
target_adapter: target_adapter://so101_isaac_adapter

observation:
  schema_source: sensor_config_ref
  require_describe_observation_schema: false
  allow_extra_channels: false
  timestamp_required: false

action_contract:
  id: so101_joint_pos_v1
  accepted_representations:
    - joint_position_targets
  shape:
    - T
    - 6
  dtype: float32
  normalized: false            # server-side denormalization (lerobot_ipu/act.py)
  frame: joint
  control_mode: joint_position
  control_hz: 30               # Isaac Sim env dt = 1/30s
  components:
    - {name: shoulder_pan,  unit: rad}
    - {name: shoulder_lift, unit: rad}
    - {name: elbow_flex,    unit: rad}
    - {name: wrist_flex,    unit: rad}
    - {name: wrist_roll,    unit: rad}
    - {name: gripper,       unit: normalized}
  chunk:
    max_chunk_size: 100                    # ACT chunk_size=100
    preferred_chunk_size: 16               # actual inference horizon
    preferred_replan_after_steps: 5
    switch_policy: hard_switch             # ACT does not support soft blend

safety:
  require_target_side_validation: true
  stop_on_nan: true
  stop_on_timeout: true

capabilities:
  available_bridges:
    - bridge://safety_clamp
  tf_frames:
    - base
